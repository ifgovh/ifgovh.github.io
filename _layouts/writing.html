---
layout: academic
---
<article class="writing-article prose">
  <header class="page-intro">
    <p class="eyebrow"><a href="{{ '/year-archive/' | relative_url }}">Writing</a>{% if page.date %} · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %d, %Y' }}</time>{% endif %}</p>
    <h1>{{ page.title }}</h1>
  </header>
  {{ content }}
</article>
