<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Statistical Physics of Loss Navigation</title>
  <desc id="desc">Fractal loss geometry induces superdiffusive gradient steps that escape sharp traps toward wide minima. Conceptual schematic, not experimental data. Stages: Fractal Loss Landscape; Superdiffusive Weight Jumps; Wide Minimum Convergence.</desc>
