  <title id="title">Critical Transition Spotlight Dynamics</title>
  <desc id="desc">Transition-regime circuit dynamics drive an oscillatory spotlight that samples visual scenes superdiffusively. Conceptual schematic, not experimental data. Stages: Circuit State Transition; Theta-Modulated Spotlight; Superdiffusive Scene Sampling.</desc>
