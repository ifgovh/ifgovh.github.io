  <title id="title">Heterogeneous Spiking Circuit Modeling</title>
  <desc id="desc">Biological heterogeneity disrupts autonomous waves so network transients reliably track external inputs. Conceptual schematic, not experimental data. Stages: Cellular Timescale Diversity; Desynchronized Wave Activity; Input-Slaved Reliable Coding.</desc>
